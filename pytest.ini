[pytest]
addopts = -v --tb=short --strict-markers --html=reports/report.html --self-contained-html --alluredir=reports/allure-results
testpaths = tests
; Framework logs propagate to the root logger, so pytest captures them into the
; "Captured log" section of the HTML report and the Allure attachment of each
; test. Add -o log_cli=true to also stream them to the console while debugging.
log_cli_format = %(asctime)s - %(levelname)s - %(name)s - %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
log_format = %(asctime)s - %(levelname)s - %(name)s - %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
markers =
    smoke: Smoke test suite - business-critical happy-path scenarios
    regression: Regression test suite - functional, negative, edge case and business rule tests
    ui: UI automation tests
    api: API automation tests
